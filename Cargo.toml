[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/chem",
    "crates/fields",
    "crates/cell",
    "crates/sim",
    "crates/analysis",
    "crates/headless",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
hadean-core = { path = "crates/core" }
hadean-chem = { path = "crates/chem" }
hadean-fields = { path = "crates/fields" }
hadean-cell = { path = "crates/cell" }
hadean-sim = { path = "crates/sim" }
hadean-analysis = { path = "crates/analysis" }

serde = { version = "1", features = ["derive", "rc"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
