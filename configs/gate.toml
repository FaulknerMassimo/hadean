# The Phase 2 population gate, at a size you will actually run.
#
# Physically this is `pond.toml`: same chemistry, same sun, same vents, same
# cell design. The only differences are the grid -- an eighth of the volume, so
# a four-cycle run takes twenty minutes instead of an afternoon -- and the cell
# lifecycle numbers, which are the ones the gate is tuned on. `pond.toml` keeps
# the defaults the code ships with.
#
#     hadean ecology --config configs/gate.toml --ticks 250000
#
# Three numbers here are the tuning, and each was arrived at by watching a
# population die of the alternative:
#
#   division_reserve = 1e-8    A population's response time is roughly
#                              division_reserve / surplus power, and it has to
#                              be long next to the resource it eats. At 2e-10
#                              the cells double every fifteen seconds, strip a
#                              day's food by mid-afternoon, and meet the night
#                              with nothing. At 3e-9 they still overshoot and
#                              die on the fourth night. This puts the two
#                              timescales within a factor of two.
#
#   starvation_time = 300      The night is three hundred seconds long and
#                              photochemistry stops dead in the dark. A cohort
#                              that cannot outlast the dark does not have a bad
#                              night, it goes extinct by morning.
#
#   maximum_age = 2400         Was 1200, and 1200 turned out to be the thing
#   lifespan_spread = 0.4      that was killing the population. Every cell died
#                              at exactly `maximum_age`, so the cohort that
#                              boomed together aged out together, and the
#                              die-off that looked like a famine landed at
#                              t = 1250-1500 for no other reason. Setting this
#                              to 1e9 makes the crash vanish outright: 136
#                              cells, zero corpses, straight through the night
#                              that had been killing a hundred and ten of them.
#                              The spread is the real fix -- each cell draws its
#                              own span, so a cohort dies over a window instead
#                              of on a date -- and the doubled mean keeps
#                              ageing clear of the first few cycles while the
#                              food dynamics are being read.
#
#   dormancy_power_fraction    A cell that cannot pay its upkeep shuts down to a
#     = 0.05                   twentieth of it rather than running up damage
#   dormancy_exit = 60         against a reserve it does not have. It keeps its
#                              membrane and its catalyst -- neither is a
#                              decision -- so it goes on banking whatever the
#                              water offers, and breaks even that much further
#                              down. With ageing out of the way this visibly
#                              works: 103 of 136 cells sit shut down while the
#                              pond is stripped to 4.6e6 particles and not one
#                              of them dies.
#
#                              The fraction is not a dial to reach for. Between
#                              0.05, 0.005 and 0.0005 the run does not change by
#                              a single cell, because while something else is
#                              doing the killing the maintenance bill is not
#                              what any of this turns on. `dormancy_exit` does
#                              matter, and in the direction that is easy to get
#                              backwards: dropping it from 60 to 5 makes things
#                              worse, because cheap waking puts cells back on
#                              full spending into a pond that cannot pay for it.
#
#   membrane_scale = 1000      The one that mattered most, and the last to be
#                              found. A cell stops eating at the concentration
#                              where uptake pays its maintenance, so this sets
#                              how much food is still in the water at dusk --
#                              and across a night, when photochemistry makes
#                              nothing, the population has to live on exactly
#                              that. At 6000 the cells are efficient enough to
#                              strip the pond bare and starve in the dark; the
#                              night bill works out at about a night's worth of
#                              production, which puts this near a thousand.
#
#   trait_spread = 0.5       Cells differ in how much membrane they carry, and
#   trait_cost = 0.5         a daughter inherits her mother's with a kick this
#                            size. Identical clones in a shared voxel all break
#                            even at the same concentration, so a shortage
#                            arrives for every cell at once and the plateau
#                            freezes; variation is what lets a population thin
#                            from the bottom while its best cells still have
#                            something to divide on.
#
#                            How much variation is needed is arithmetic, not
#                            taste. The marginal cell fixes the water, and a
#                            cell a fraction d better off is left with
#                            maintenance_power (1 - trait_cost) d to bank -- so
#                            it can only fund a daughter if
#
#                              division_reserve
#                                  < maintenance_power (1-trait_cost) d max_age
#
#                            At 0.2 the living spread reached 0.32 and that
#                            budget came to 3.8e-9 J against a division_reserve
#                            of 1e-8: short, and the run recorded not one birth
#                            after its peak, exactly like the clone control.
#                            0.5 is the largest of the four spreads tried and
#                            the best of them: the plateau goes from 136 to 156
#                            on the same food, and the run finishes with five
#                            cells alive rather than none. `hadean ecology`
#                            prints this budget before it starts.
#
#                            `trait_cost` is what stops uptake being a free
#                            dial, and it decides which way selection runs. At
#                            0.5 the survivors of a stripped pond are the cheap
#                            cells (mean uptake 0.33); at 0.25, where machinery
#                            costs less, they are the hungry ones (1.63). It is
#                            neutral at uptake = 1, so a population of clones
#                            does not notice it at all.
#
# What this config does NOT do is meet the gate, and the reason has moved out of
# the cell layer entirely. The population's food is CH2O2S, which this chemistry
# makes photochemically out of H2S and CO2 -- and CO2 takes part in exactly one
# reaction in the whole network, that one. The cells turn CH2O2S into CH2OS and
# nothing turns it back on any timescale that matters, so every turnover retires
# a carbon for good. The larder falls from 1.15e13 to 1e9 over four days in
# every run, clones and variants alike; a pond with one cell that cannot eat
# holds it flat at 1.15e13 for the same four days. This population is not
# failing to regulate. It is mining a finite pool, and no dial below reaches
# that. See HANDOFF.md, "The population is mining, not grazing".
#
# The sun deliberately still rises and sets. A fixed sun looks like better
# experiment control and is not: it drains the photoreaction's precursor and
# the food supply decays to nothing. The night is what puts it back.

name = "gate"
seed = 1
dt = 0.01

[grid]
nx = 24
ny = 24
nz = 10
dx = 2.5e-5

[schedule]
physics = 1
chemistry = 1
transport = 1
neural = 1
expression = 10
growth = 20
development = 50
phylogeny = 500
audit = 100

[chemistry]
n_compounds = 32
n_reactions = 240
max_skeleton = 4
ea_min_zj = 6.0
ea_max_zj = 160.0
rate_min = 0.1
rate_max = 10000.0
addition_fraction = 0.3
absorption_scale = 4000.0
photo_yield = 0.35
n_photo = 2

[light]
irradiance = [40.0, 70.0, 95.0, 110.0, 105.0, 85.0, 55.0, 30.0]
medium_extinction = [220.0, 260.0, 300.0, 350.0, 420.0, 520.0, 650.0, 820.0]
day_length = 600.0

[heat]
ambient = 293.15
sky = 289.15
surface_transfer = 60.0
vent_power = 2.0e-9
vents = 3

[flow]
speed = 2.0e-5
rolls = 2

[vents]
fuel_rate = 4.0e9
fuel_species = 2

[initial]
water = 2.0e11
primordial = 2.0e9
noise = 0.25

[cells]
enabled = true
initial_count = 16
population_cap = 60000
birth_radius = 4.0e-6
membrane_scale = 1000.0
metabolic_rate = 20.0
capture_efficiency = 0.6
maintenance_power = 1.0e-11
division_reserve = 1.0e-8
starvation_time = 300.0
maximum_age = 2400.0
lifespan_spread = 0.4
trait_spread = 0.5
trait_cost = 0.5
dormancy_power_fraction = 0.05
dormancy_exit = 60.0
decomposition_rate = 0.8
seed_delay = 150.0
